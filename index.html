<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYMBOL_HALFTONE.exe</title>
    <meta name="description" content="Symbol / shape halftone portrait generator. Local, in-browser, no uploads." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='12' fill='%23fff' text-anchor='middle'%3E%23%3C/text%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; background: #000; color: #fff; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; background: #000; color: #fff;
        font-family: "Ubuntu Mono", "JetBrains Mono", "Courier New", monospace;
        font-size: 13px; line-height: 1.45;
        display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
        padding: 0 0 0 max(24px, 6vw); letter-spacing: 0.02em;
        transition: opacity 120ms linear;
      }
      #boot .dim { color: #6b6b6b; }
      #boot-stage { white-space: pre; transition: opacity 160ms linear; }
      #boot-prompt {
        position: fixed; inset: 0; display: none; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        letter-spacing: 0.02em;
      }
      #boot-prompt.on { display: flex; }
      #boot-press {
        font-family: "Ubuntu Mono", "JetBrains Mono", "Courier New", monospace;
        font-size: 13px; letter-spacing: 0.02em;
      }
      /* no room beside the centred prompt: drop the log (phones, narrow windows) */
      @media (max-width: 900px) {
        #boot-stage { display: none !important; }
      }
      #boot-press::after { content: "_"; animation: bootblink 1.05s steps(1) infinite; }
      @keyframes bootblink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
      #boot-noise { position: fixed; inset: 0; z-index: 10000; background: #000; color: #fff;
        font-family: "Ubuntu Mono", monospace; font-size: 13px; line-height: 1.05; letter-spacing: 0.02em;
        white-space: pre; overflow: hidden; display: none; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #boot-press::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite"><div id="boot-stage"><span id="boot-title">INITIALIZING SYMBOL ENGINE...</span>
<span id="boot-bar" class="dim">[                    ]</span>
<span id="boot-log"></span></div>
      <div id="boot-prompt"><div id="boot-press"></div></div>
    </div>
    <div id="boot-noise" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      (function () {
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var boot = document.getElementById('boot');
        var stage = document.getElementById('boot-stage');
        var bar = document.getElementById('boot-bar');
        var log = document.getElementById('boot-log');
        var title = document.getElementById('boot-title');
        var prompt = document.getElementById('boot-prompt');
        var press = document.getElementById('boot-press');
        var noiseEl = document.getElementById('boot-noise');
        var start = Date.now();
        var repeat = false;
        try { repeat = sessionStorage.getItem('sh_booted') === '1'; sessionStorage.setItem('sh_booted', '1'); } catch (e) {}
        var MIN = reduced ? 0 : (repeat ? 320 : 620);
        var lines = ['> loading renderer', '> loading symbol library', '> allocating canvas', '> initializing interface', '> ready'];
        var glyphs = '░▒▓█';
        var pool = '#%+/X><:.▓▒░ =*-|';
        // no keyboard to press on a phone
        var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var PRESS_TEXT = touch ? 'TAP TO CONTINUE' : 'PRESS ANY KEY TO CONTINUE';
        var i = 0, timers = [];
        var ready = false, prompted = false, handing = false, promptAt = 0;

        // The app is behind this overlay and cannot be reached until it goes
        // away, so anything that can wedge the sequence has an escape hatch.
        window.__bootAlive = true;

        if (reduced) {
          title.textContent = 'loading...';
          bar.textContent = '';
        } else {
          var t1 = setInterval(function () {
            var s = '[';
            for (var k = 0; k < 20; k++) s += glyphs[(Math.random() * 4) | 0];
            s += ']';
            bar.textContent = s;
          }, 55);
          timers.push(function () { clearInterval(t1); });
          var t2 = setInterval(function () {
            if (i < lines.length) { log.textContent += (i ? '\n' : '') + lines[i]; i++; }
          }, Math.max(70, MIN / (lines.length + 1)));
          timers.push(function () { clearInterval(t2); });
        }

        function stopTimers() { timers.forEach(function (f) { f(); }); timers = []; }

        /* -------- the "press any key" gate -------- */

        function scramble(el, text, duration, then) {
          if (reduced) { el.textContent = text; if (then) then(); return; }
          var t0 = Date.now();
          (function step() {
            var t = (Date.now() - t0) / duration;
            if (t >= 1) { el.textContent = text; if (then) then(); return; }
            var out = '';
            for (var c = 0; c < text.length; c++) {
              if (text[c] === ' ') out += ' ';
              else out += Math.random() < t ? text[c] : pool[(Math.random() * pool.length) | 0];
            }
            el.textContent = out;
            requestAnimationFrame(step);
          })();
        }

        function showPrompt() {
          if (prompted || handing) return;
          prompted = true;
          stopTimers();
          // the log stays where it is, finished: full bar, all lines printed
          if (log) log.textContent = lines.join('\n');
          if (bar) bar.textContent = '[████████████████████]';
          scramble(title, 'SYMBOL ENGINE READY.', 260);
          // armed straight away: a key pressed while the prompt is still
          // resolving must not fall through a gap and be lost
          promptAt = Date.now();
          window.addEventListener('keydown', onGo, true);
          window.addEventListener('pointerdown', onGo, true);
          window.addEventListener('wheel', onGo, { capture: true, passive: true });
          setTimeout(function () {
            if (handing) return;
            prompt.className = 'on';
            scramble(press, PRESS_TEXT, 420);
          }, reduced ? 0 : 220);
        }

        function onGo(e) {
          if (e && e.type === 'keydown' && (e.metaKey || e.ctrlKey || e.altKey)) return;
          // the same press that revealed the prompt should not also dismiss it
          if (Date.now() - promptAt < 150) return;
          handoff();
        }

        /* a key pressed while the log is still running skips ahead to the gate */
        function onSkip(e) {
          if (e && e.type === 'keydown' && (e.metaKey || e.ctrlKey || e.altKey)) return;
          showPrompt();
        }
        window.addEventListener('keydown', onSkip, true);
        window.addEventListener('pointerdown', onSkip, true);

        function noiseBurst(done) {
          if (reduced) { done(); return; }
          var cols = Math.min(220, Math.ceil(window.innerWidth / 7.2));
          var rows = Math.min(120, Math.ceil(window.innerHeight / 13.6));
          noiseEl.style.display = 'block';
          var frames = 0;
          function step() {
            frames++;
            var density = frames < 3 ? 0.85 : Math.max(0, 0.85 - (frames - 2) * 0.24);
            var out = '';
            for (var r = 0; r < rows; r++) {
              for (var c = 0; c < cols; c++) out += Math.random() < density ? pool[(Math.random() * pool.length) | 0] : ' ';
              out += '\n';
            }
            noiseEl.textContent = out;
            if (frames < 7) requestAnimationFrame(step);
            else { noiseEl.style.display = 'none'; noiseEl.textContent = ''; done(); }
          }
          requestAnimationFrame(step);
        }

        function teardown() {
          stopTimers();
          // only black fades out; the log must not linger over the intro wave
          stage.style.display = 'none';
          prompt.style.display = 'none';
          window.removeEventListener('keydown', onGo, true);
          window.removeEventListener('pointerdown', onGo, true);
          window.removeEventListener('keydown', onSkip, true);
          window.removeEventListener('pointerdown', onSkip, true);
          noiseEl.style.display = 'none';
          noiseEl.textContent = '';
          boot.style.opacity = '0';
          window.__bootAlive = false;
          setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 140);
        }

        /* -------- boot screen -> interface -------- */

        function handoff() {
          if (handing) return;
          handing = true;
          clearTimeout(hardPrompt);
          window.removeEventListener('keydown', onGo, true);
          window.removeEventListener('pointerdown', onGo, true);
          window.removeEventListener('keydown', onSkip, true);
          window.removeEventListener('pointerdown', onSkip, true);
          var run = function () {
            teardown();
            // the interface builds itself back out of the noise, top to bottom
            if (typeof window.__introRun === 'function') window.__introRun();
          };
          if (reduced) { run(); return; }
          // dissolve the prompt, then punch through with a burst of noise
          var t0 = Date.now();
          (function melt() {
            var t = (Date.now() - t0) / 200;
            if (t >= 1) { press.textContent = ''; noiseBurst(run); return; }
            var out = '';
            for (var c = 0; c < PRESS_TEXT.length; c++) {
              out += Math.random() < t ? ' ' : pool[(Math.random() * pool.length) | 0];
            }
            press.textContent = out;
            requestAnimationFrame(melt);
          })();
        }

        // If the app never signals it is up, still offer the way in.
        var hardPrompt = setTimeout(showPrompt, 7000);

        window.__bootFinish = function () {
          if (ready) return;
          ready = true;
          setTimeout(showPrompt, Math.max(0, MIN - (Date.now() - start)));
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
